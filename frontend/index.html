<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Inventario - Reto Full Stack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <h1>Sistema de Gestión Full Stack</h1>
    <div id="user-info" class="hidden">
      <span id="welcome-msg"></span>
      <button id="btn-logout" class="btn-secondary">Cerrar Sesión</button>
    </div>
  </header>

  <main class="container">
    <div id="alert-box" class="alert hidden"></div>

    <!-- Sección de Login / Registro -->
    <section id="auth-section" class="card auth-card">
      <h2 id="auth-title">Iniciar Sesión</h2>
      <form id="auth-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="Ingresa tu usuario" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
        </div>
        <button type="submit" class="btn-primary" id="btn-submit-auth">Entrar</button>
      </form>
      <p class="toggle-text">
        ¿No tienes cuenta? <a href="#" id="toggle-auth">Regístrate aquí</a>
      </p>
    </section>

    <!-- Sección Principal de Datos (CRUD) -->
    <section id="dashboard-section" class="hidden">
      <div class="card form-card">
        <h3>Agregar Nuevo Elemento</h3>
        <form id="item-form">
          <div class="grid-inputs">
            <input type="text" id="nombre" placeholder="Nombre del artículo" required>
            <input type="text" id="categoria" placeholder="Categoría" required>
            <input type="number" id="precio" placeholder="Precio ($)" step="0.01" required>
            <input type="number" id="stock" placeholder="Cantidad en stock" value="1" required>
          </div>
          <button type="submit" class="btn-primary">Guardar Elemento</button>
        </form>
      </div>

      <div class="card list-card">
        <h3>Catálogo de Elementos en Base de Datos</h3>
        <div id="items-list" class="items-grid"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
